<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.30  0 0 0 0.06 0"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.40  0 0 0 0 0.34  0 0 0 0 0.28  0 0 0 0.08 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#cloud)"/>
  <rect width="360" height="360" filter="url(#grain)"/>
</svg>
